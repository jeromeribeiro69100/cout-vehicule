<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coût véhicule</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
:root{--bg:#eceff2;--card:#fff;--tx:#14202b;--mu:#5b6a77;--ac:#0a6c74;--on:#fff;--ac2:#dbebed;--bd:#d3dae0;--wa:#a3470a;--dg:#b3261e;--cl:#10222f;--cl2:#091821;--clt:#eaf2f6;--clm:#8fa5b4;--tab:70px;
--f1:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f2:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1218;--card:#151d26;--tx:#e8eef2;--mu:#93a2af;--ac:#4cc3cf;--on:#05222a;--ac2:#12303a;--bd:#263340;--wa:#f0a64a;--dg:#c93c32;--cl:#182733;--cl2:#0d1a23}}
:root[data-theme="dark"]{--bg:#0c1218;--card:#151d26;--tx:#e8eef2;--mu:#93a2af;--ac:#4cc3cf;--on:#05222a;--ac2:#12303a;--bd:#263340;--wa:#f0a64a;--dg:#c93c32;--cl:#182733;--cl2:#0d1a23}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:auto;margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 var(--f1);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--tab) + 28px + env(safe-area-inset-bottom,0px))}
#app{max-width:520px;margin:0 auto;padding:16px 16px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2{margin:8px 0 16px;font:600 30px/1.05 var(--f2);letter-spacing:.005em}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two>div{min-width:0}.two label:first-child{margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{font-size:13px;color:var(--mu)}
.big{font:600 52px/1 var(--f2);font-variant-numeric:tabular-nums}
.val{font:600 24px var(--f2);font-variant-numeric:tabular-nums}
.u{font:400 15px var(--f1);color:var(--mu)}
.wa{color:var(--wa)}
label{display:block;margin:14px 0 6px;font-size:14px;font-weight:500;color:var(--mu)}
.card label:first-child{margin-top:0}
input,select{width:100%;min-height:48px;padding:10px 12px;font:inherit;font-size:17px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;margin:0 12px 0 0;accent-color:var(--ac)}
.cb{display:flex;align-items:center;min-height:48px;margin:2px 0;font-size:17px;font-weight:400;color:var(--tx);cursor:pointer}
button{font:inherit;font-weight:500;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button:active{filter:brightness(.94)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
button.pr{display:block;width:100%;min-height:54px;margin-top:16px;background:var(--ac);color:var(--on);border:0;font-size:18px;font-weight:600}
.sv{position:sticky;bottom:calc(var(--tab) + 12px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 0 0 12px var(--bg)}
.bk{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 0;border:0;background:none;color:var(--ac);font-weight:600}
.ib{width:44px;padding:0;display:inline-grid;place-items:center}
.ib.dg{width:auto;padding:0 12px;background:var(--dg);color:#fff;border-color:transparent}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:15px}
.li:last-child{border:0}.li>span:last-child{display:flex;gap:6px;flex:none}
.info{background:var(--ac2);border-left:3px solid var(--ac);border-radius:6px;padding:10px 12px;margin-top:12px;font-size:15px}
table{width:100%;border-collapse:collapse}
th{font-size:13px;font-weight:500;color:var(--mu)}
td,th{padding:8px 8px 8px 0;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* tableau de bord */
.hero{margin-bottom:24px;padding:16px 16px 18px;border-radius:18px;background:var(--cl);color:var(--clt)}
.hero select{background:var(--cl2);color:var(--clt);border:1px solid #2b4456;font-weight:500}
.odo{display:flex;gap:4px;margin:18px 0 6px}
.odo span{flex:1;max-width:46px;height:60px;display:grid;place-items:center;background:var(--cl2);border:1px solid #223a4a;border-radius:6px;font:600 40px/1 var(--f2);font-variant-numeric:tabular-nums}
.odo .z{color:#4a6171}
.odl,.cap{font-size:13px;color:var(--clm)}
.cost{display:flex;align-items:baseline;gap:8px;margin-top:22px}
.cn{font:600 58px/1 var(--f2);font-variant-numeric:tabular-nums}
.cu{font:500 20px var(--f2);color:var(--clm)}
.bar{display:flex;gap:3px;height:10px;margin:14px 0 10px}
.bar i{display:block;border-radius:3px;min-width:4px}
.bar.e{background:var(--cl2);border-radius:3px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.leg span{display:inline-flex;align-items:center;gap:6px;color:var(--clm)}
.leg i{width:10px;height:10px;border-radius:2px}
.leg b{color:var(--clt);font-weight:600;font-variant-numeric:tabular-nums}
.sec{margin:0 0 22px}
.sec>h3{margin:0 0 2px;font:600 14px var(--f1);color:var(--mu)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.ln:last-child{border-bottom:0}
.ln b{font:600 24px var(--f2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ln b i{font:400 14px var(--f1);font-style:normal;color:var(--mu)}
.act{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:8px 0;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;text-align:left;font-size:17px}
.act:last-child{border-bottom:0}
.ai{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--ac2);color:var(--ac)}
.ch{margin-left:auto;color:var(--mu)}

/* navigation basse + message */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs>div{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:520px}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tab);padding:0;border:0;border-radius:0;background:none;color:var(--mu);font-size:12px;font-weight:500}
#tabs button.on{color:var(--ac);font-weight:600}
#tabs button.on::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
#tabs .ic{width:23px;height:23px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;z-index:30;padding:12px 14px;border-radius:10px;background:var(--tx);color:var(--bg);font-size:15px;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.top{display:flex;justify-content:space-between;align-items:center}
.top{gap:8px}.top h1{font-size:22px;white-space:nowrap;min-width:0}.top button{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:0 12px}
h1{margin:4px 0 12px;font:600 30px/1.05 var(--f2)}
.vsel{min-height:58px;font-size:22px;font-weight:600}
.grid .pr{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:0;padding:0 8px;font-size:17px}
.grid .card{margin-bottom:0}.grid+.grid{margin-top:12px}.grid{margin-bottom:12px}
#tabs>div{display:block;padding:8px 16px}
#tabs button.rt{width:100%;height:54px;flex-direction:row;gap:6px;background:var(--ac);color:var(--on);border-radius:10px;font-size:18px;font-weight:600}
#tabs button.rt .ic{width:22px;height:22px}
input[type=radio]{border-radius:50%}
.card .tar .two label:first-child{margin-top:12px}
.tar+.tar{margin-top:16px;padding-top:2px;border-top:1px solid var(--bd)}
</style></head>
<body><div id="app"></div><nav id="tabs" aria-label="Navigation"></nav>
<script>
window.addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;top:8px;left:8px;right:8px;z-index:99;background:#b3261e;color:#fff;padding:10px 12px;border-radius:8px;font:14px system-ui,sans-serif';d.textContent='Erreur : '+e.message+' (ligne '+e.lineno+')';document.body.appendChild(d)});
const FU=['Gasoil','98','95-E5','95-E10','E85','GPL','Électrique'],ET={'Gasoil':0,'98':5,'95-E5':5,'95-E10':10,'E85':85,'GPL':0,'Électrique':0};
window.alert=m=>{let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(window._tt);window._tt=setTimeout(()=>{t.className=''},4000)};
const IC={home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',fuel:'<path d="M5 21V5a2 2 0 012-2h6a2 2 0 012 2v16M4 21h12M5 10h10M15 8h2.5A1.5 1.5 0 0119 9.5V16a1.5 1.5 0 003 0V9l-3-3"/>',pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',doc:'<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>',sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',tyre:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v5.5M12 15.5V21M3 12h5.5M15.5 12H21"/>',wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',road:'<path d="M8 3L4 21M16 3l4 18M12 4v3M12 11v3M12 18v3"/>',gauge:'<path d="M4 17a8 8 0 1116 0"/><path d="M12 17l4-5"/>',chev:'<path d="M9 6l6 6-6 6"/>',back:'<path d="M15 6l-6 6 6 6"/>',edit:'<path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
let S={cars:[],log:[],sel:null,sites:[],tolls:[]},V={n:'home',c:null,e:null};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('cv1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cv1',JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),v=i=>$(i).value;
const f=(n,d=2)=>n==null||isNaN(n)?'—':n.toFixed(d).replace('.',',');
const car=id=>S.cars.find(c=>c.id==id);
const cur=()=>car(S.sel)||S.cars.find(c=>c.main)||S.cars[0];
const cur2=()=>car(V.c)||cur();
const nm=c=>((c.marque||'')+' '+(c.modele||'')).trim()||'Véhicule';
const today=()=>new Date().toISOString().slice(0,10);
const ent=(c,t,fn)=>S.log.filter(e=>e.car==c&&(!t||e.type==t)&&(!fn||fn(e))).sort((a,b)=>a.km-b.km);
const mk=e=>e.type=='km'||!!e.init||(e.type=='fuel'&&!!e.perso);
function mdl(l){const d={};let p=null;l.forEach(e=>{if(mk(e)){d[e.id]=p!=null?e.km-p:null;p=e.km}else d[e.id]=null});return d}
function rate(l){if(l.length<2)return{};const sp=l[l.length-1].km-l[0].km;if(sp<=0)return{};
 return{km:sp/(l.length-1),eur:l.slice(1).reduce((a,e)=>a+(e.eur||0),0)/sp*100,vol:l.slice(1).reduce((a,e)=>a+(e.vol||0),0)/sp*100}}
function frate(l,co){const fu=l.filter(e=>e.full);if(fu.length<2)return{};const a=fu[0],b=fu[fu.length-1],sp=b.km-a.km;if(sp<=0)return{};
 const m=l.filter(e=>e.km>a.km&&e.km<=b.km);return{vol:m.reduce((x,e)=>x+(e.vol||0),0)/sp*100,eur:m.reduce((x,e)=>x+((co&&e.payer=='perso')?0:(e.eur||0)),0)/sp*100}}
function tyreRate(c){const l=ent(c,'tyre'),R=l.filter(e=>e.sub!='Réparation'),nb=e=>e.nb||4;
 if(!R.length)return{};
 const a=R[0],all=ent(c),mx=all[all.length-1].km,out={},m=[0,1,2,3].map(()=>(car(c)||{}).km0||0),L=[];
 R.forEach(e=>{for(let k=0;k<Math.min(nb(e),4);k++){let j=0;for(let i=1;i<4;i++)if(m[i]<m[j])j=i;if(e.km>m[j])L.push(e.km-m[j]);m[j]=e.km}});
 if(L.length)out.km=L.reduce((x,y)=>x+y,0)/L.length;
 if(R.length>=2){const b=R[R.length-1],sp=b.km-a.km;
  if(sp>0)out.eur=l.filter(e=>e.km>a.km&&e.km<=b.km).reduce((x,e)=>x+(e.eur||0),0)/sp*100;
  return out}
 const sp=mx-a.km;
 if(sp>0){out.eur=l.filter(e=>e.km>=a.km).reduce((x,e)=>x+(e.eur||0),0)/sp*100;out.est=true}
 return out}
function insur(id){const c=car(id),T=((c&&c.assur)||[]).filter(t=>t.date&&t.eur>=0).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0),out={};
 if(!T.length)return out;
 const D=d=>Date.parse(d+'T00:00:00Z')/864e5,dr=t=>(t.per=='mensuel'?t.eur*12:t.eur)/365,nw=today();
 let t0=null;T.forEach(x=>{if(x.date<=nw)t0=x});if(t0)out.day=dr(t0);
 let cost=0;T.forEach((t,i)=>{const e=i+1<T.length&&T[i+1].date<nw?T[i+1].date:nw;if(e>t.date)cost+=(D(e)-D(t.date))*dr(t)});
 const all=ent(id),last=all.length?all[all.length-1].km:0;
 if(cost>0){out.cost=cost;if(last>0)out.km=cost/last*100}
 return out}
function maintRate(c){const l=ent(c,'maint'),V=l.filter(e=>(e.sub||'Vidange')=='Vidange'),O=l.filter(e=>e.sub=='Accessoire'||e.sub=='Réparation'||e.sub=='Lavage'),out={},r=[],iv=[];
 for(let i=0;i<V.length;i++){const d=V[i].km-(i?V[i-1].km:0);if(d>0){r.push((V[i].eur||0)/d*100);iv.push(d)}}
 if(r.length){out.v=r.reduce((a,b)=>a+b,0)/r.length;out.km=iv.reduce((a,b)=>a+b,0)/iv.length}
 const all=ent(c),last=all.length?all[all.length-1].km:0;
 if(O.length&&last>0)out.o=O.reduce((a,e)=>a+(e.eur||0),0)/last*100;
 if(out.v!=null||out.o!=null)out.eur=(out.v||0)+(out.o||0);
 return out}
function stats(c){const F=frate(ent(c,'fuel')),T=tyreRate(c),M=maintRate(c);
 const t=[F.eur,T.eur,M.eur].filter(x=>x!=null);return{F,T,M,tot:t.length?t.reduce((a,b)=>a+b,0):null}}
const fld=(l,h)=>`<label>${l}</label>${h}`;
const carSel=()=>{const c=cur2();return fld('Véhicule',`<select onchange="V.c=this.value;render()">${S.cars.map(x=>`<option value="${x.id}" ${x.id==c.id?'selected':''}>${nm(x)}${x.main?' ★':''}</option>`).join('')}</select>`)};
const need=()=>`<div class="card"><b>Aucun véhicule</b><p class="k" style="margin:6px 0 0">Ajoutez votre véhicule pour enregistrer pleins, entretiens et kilomètres.</p><button class="pr" onclick="go('cf',null,null)">Ajouter un véhicule</button></div>`;
function go(n,c,e){V.d=null;V.imp=null;V.t=null;V.n=n;if(c!==undefined)V.c=c;if(e!==undefined)V.e=e;scrollTo(0,0);render()}

function home(){const c=cur();
 let h=`<div class="top"><h1>Coût véhicule</h1><div style="display:flex;gap:8px"><button onclick="expCSV()" aria-label="Exporter en CSV">${ic('download')} Exporter</button><button onclick="go('params')" aria-label="Paramètres">⚙️</button></div></div>`;
 if(!c)return h+need();
 const s=stats(c.id),A=insur(c.id);
 h+=`<select class="vsel" aria-label="Véhicule" onchange="S.sel=this.value;save();render()">${S.cars.map(x=>`<option value="${x.id}" ${x.id==c.id?'selected':''}>${nm(x)}${x.main?' ★':''}</option>`).join('')}</select>
 <div class="card" style="margin-top:12px"><div class="k">Coût total estimé</div><div class="val">${f(s.tot)} <span class="u">€/100 km</span></div></div>
 <div class="grid">
 <div class="card"><div class="k">Moyenne</div><div class="val">${f(s.F.vol)} <span class="u">L/100km</span></div></div>
 <div class="card"><div class="k">Carburant</div><div class="val">${f(s.F.eur)} <span class="u">€/100km</span></div></div>
 <div class="card"><div class="k">Pneus : 2 pneus tous les</div><div class="val">${f(s.T.km,0)} <span class="u">km</span></div></div>
 <div class="card"><div class="k">Pneus${s.T.est?' (estimé)':''}</div><div class="val">${f(s.T.eur)} <span class="u">€/100km</span></div></div>
 <div class="card"><div class="k">Assurance</div><div class="val">${f(A.km)} <span class="u">€/100km</span></div><div class="k">${f(A.day)} €/jour</div></div>
 <div class="card"><div class="k">Entretiens</div><div class="val">${f(s.M.eur)} <span class="u">€/100km</span></div></div></div>
 <div class="grid"><button class="pr" onclick="go('fuel',null)">⛽ Carburant</button><button class="pr" onclick="go('km',null)">📍 Suivi des km</button>
 <button class="pr" onclick="go('maint',null)">🔧 Entretien</button><button class="pr" onclick="go('tyre',null)">🛞 Pneumatique</button>
 <button class="pr" onclick="go('toll',null)">🛣 Péage perso</button><button class="pr" onclick="go('rc',null)">📄 Récap PDF</button></div>
 <p class="k">Les moyennes apparaissent à partir de 2 entrées par catégorie (carburant : calculé entre pleins, case « Plein » cochée).</p>`;
 return h}

const CC=['table','id','car','type','date','km','vol','eur','ppl','fuel','full','eth','perso','pro','pkm','pL','site','sub','init','payer','marque','modele','moteur','annee','pneu','immat','reservoir','proprio','main','fuels','nb','km0','assur'];
const cq=x=>{x=x==null?'':typeof x=='boolean'?(x?1:0):Array.isArray(x)?x.join('|'):String(x);return /[;"\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
function toCSV(){const L=[CC.join(';')],row=o=>L.push(CC.map(k=>cq(o[k])).join(';'));
 S.cars.forEach(c=>row(Object.assign({},c,{table:'vehicule',assur:(c.assur||[]).map(t=>[t.date,t.eur,t.per].join('~'))})));S.log.forEach(e=>row(Object.assign({},e,{table:'entree'})));
 (S.sites||[]).forEach(x=>row({table:'site',site:x}));(S.tolls||[]).forEach(t=>row(Object.assign({},t,{table:'peage'})));row({table:'reglage',id:S.sel});return L.join('\r\n')}
function parseCSV(t){t=t.replace(/^\ufeff/,'');const sep=t.split(/\r?\n/)[0].includes(';')?';':',',rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const h=t[i];
  if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}

  if(s.head){doc.setFont(undefined,'bold');s.head.forEach((t,i)=>doc.text(t,X[i],y));y+=6;doc.setFont(undefined,'normal')}
  s.rows.forEach(w=>{if(y>280){doc.addPage();y=20}
   if(s.head)w.forEach((t,i)=>doc.text(i?t:t.slice(0,45),X[i],y));else{doc.text(w[0],15,y);doc.text(w[1],195,y,{align:'right'})}y+=6});y+=6});
 try{await saveFile('recap-'+(c.immat||nm(c)).replace(/[^\w-]+/g,'_')+'-'+V.ry+(V.rm?'-'+String(V.rm).padStart(2,'0'):'')+(V.rt=='p'?'-perso':'')+'.pdf',doc.output('blob'),'application/pdf')}catch(e){if(!e||e.code!='declined')alert('Échec : '+((e&&(e.message||e.code))||''))}}

 return `<h2>Péage perso</h2><div class="card">${carSel()}${fld('Date',`<input id="td" type="date" value="${x.date||today()}">`)}${fld('Montant (€)',`<input id="te" type="number" inputmode="decimal" value="${x.eur==null?'':x.eur}">`)}</div>
 <button class="pr" onclick="saveT()">Enregistrer</button>
 <div class="card" style="margin-top:12px"><div class="k">Historique · total ${f(l.reduce((a,t)=>a+t.eur,0))} €</div>${l.map(t=>`<div class="li"><span>${dfr(t.date)}<br><span class="k">${f(t.eur)} €</span></span><span><button class="ib" aria-label="Modifier" onclick="V.t=${t.id};render()">${ic('edit')}</button> <button class="ib ${V.d=='t'+t.id?'dg':''}" aria-label="Supprimer" onclick="delT(${t.id})">${V.d=='t'+t.id?'Supprimer ?':ic('x')}</button></span></div>`).join('')||'<span class="k">Vide</span>'}</div>`}

 if(V.t){const t=S.tolls.find(x=>x.id==V.t);if(t){t.date=dt;t.eur=eur}}else S.tolls.push({id:Date.now(),car:cur2().id,date:dt,eur});V.t=null;save();render()}

 if(n=='fuel')upd();if(n=='rc')rcR();}

 const iso=d=>{const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(d||'');return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):d};
 let first=null;
 S.cars.filter(c=>!ok(c.id)).forEach(c=>{ch=true;const tw=S.cars.find(x=>ok(x.id)&&x.immat&&x.immat==c.immat);

 const key=e=>['car','type','date','km','vol','eur','site','fuel','perso','pro'].map(k=>e[k]).join('|'),good=new Set();
 S.log.forEach(e=>{if(ok(e.id)&&ok(e.car)){if(e.date!=iso(e.date)){e.date=iso(e.date);ch=true}good.add(key(e))}});
 S.log=S.log.filter(e=>{if(ok(e.id)&&ok(e.car))return true;ch=true;
  if(!ok(e.car))e.car=first!=null?first:(S.cars[0]&&S.cars[0].id);e.date=iso(e.date);
  if(good.has(key(e)))return false;e.id=nid();good.add(key(e));return true});
 if(S.sel!=null&&!car(S.sel)){S.sel=null;ch=true}
 if(ch)save()}
